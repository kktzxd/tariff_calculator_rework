{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css">
        <meta charset="utf-8">
    </head>
    <body>
        <div class="container">
            <a href="{%url 'tariffs' %}"><button class="button">Тарифы</button></a>
            <h1>Расчет платежа</h1>
            
            <div class="form-group">
                <label for="start_date">Начало</label>
                <input type="text" id="start_date" class="form-input" placeholder="ДД.ММ.ГГГГ">
            </div>
            
            <div class="form-group">
                <label for="end_date">Конец</label>
                <input type="text" id="end_date" class="form-input" placeholder="ДД.ММ.ГГГГ">
            </div>
            
            <div class="form-group">
                <label for="square">Площадь</label>
                <input type="text" id="square" class="form-input" name="square" placeholder="м²">
            </div>
            
            <button class="button calculate-btn" onclick="calculate()">Рассчитать стоимость</button>
            
            <div id="result" class="result-box"></div>
        </div>
    </body>
    <script src="{% static 'calculator.js' %}"></script>
</html>
